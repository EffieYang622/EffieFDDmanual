<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDD 工作手册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6fa;color:#2c3e50}
.login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(20,40,60,.55),rgba(15,30,45,.7)),url(https://free-images.com/or/d8c9/great_wall_china_chinese_10.jpg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:rgba(255,255,255,.95);padding:40px;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;width:380px;backdrop-filter:blur(10px)}
.login-box h2{color:#1F4E79;margin-bottom:8px;font-size:22px}
.login-box .sub{color:#888;font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;font-size:14px;outline:none}
.login-box input:focus{border-color:#1F4E79}
.login-box button{width:100%;padding:12px;margin-top:16px;background:#1F4E79;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;font-weight:bold}
.login-box button:hover{background:#163d5c}
.login-box .error{color:#c0392b;font-size:12px;margin-top:8px;display:none}
.container{display:none;max-width:1400px;margin:0 auto}
.header{background:linear-gradient(rgba(15,40,60,.55),rgba(30,50,70,.65)),url(https://free-images.com/lg/d8c9/great_wall_china_chinese_10.jpg) center 25%/cover no-repeat;color:#fff;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 3px 12px rgba(0,0,0,.25)}
.header h1{font-size:16px;font-weight:600}
.header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px}
.header button:hover{background:rgba(255,255,255,.25)}
.watermark{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden}
.watermark span{position:absolute;color:rgba(0,0,0,.06);font-size:20px;white-space:nowrap;transform:rotate(-20deg);font-weight:bold;letter-spacing:4px}
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:260px;background:#fff;border-right:1px solid #e0e0e0;padding:16px 0;overflow-y:auto}
.sidebar-item{display:block;padding:10px 20px;color:#555;text-decoration:none;font-size:13px;border-left:3px solid transparent;transition:all .15s;cursor:pointer}
.sidebar-item:hover{background:#f0f4f8;color:#1F4E79}
.sidebar-item.active{background:#e8f0fe;color:#1F4E79;border-left-color:#1F4E79;font-weight:600}
.content-area{flex:1;padding:32px 40px;overflow-y:auto;max-height:calc(100vh - 52px)}
.content-area h2{color:#1F4E79;font-size:22px;margin-bottom:8px;padding-bottom:12px;border-bottom:2px solid #1F4E79}
.content-area h3{color:#1F4E79;font-size:16px;margin:20px 0 10px}
.content-area h4{color:#2c3e50;font-size:13px;margin:14px 0 8px}
.content-area p{font-size:13px;line-height:1.7;margin:6px 0;color:#444}
.content-area .bold{font-weight:600;color:#2c3e50}
.content-area .spacer{height:4px}
.content-area li{font-size:13px;line-height:1.6;margin:4px 0 4px 20px;color:#555}
.content-area table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px}
.content-area th{background:#1F4E79;color:#fff;padding:6px 8px;text-align:left;font-weight:600}
.content-area td{padding:5px 8px;border-bottom:1px solid #e8e8e8}
.content-area tr:nth-child(even) td{background:#f8f9fb}
.content-area tr:hover td{background:#e8f0fe}
.footer{text-align:center;padding:24px;color:#999;font-size:12px;border-top:1px solid #e0e0e0}
.placeholder{text-align:center;padding:60px;color:#999}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
<div class="login-box">
<h2>FDD 工作手册</h2>
<p class="sub">财务尽职调查分析与核查方法体系</p>
<input type="text" id="username" placeholder="用户名" autocomplete="off">
<input type="password" id="password" placeholder="密码">
<button onclick="login()">进入手册</button>
<p class="error" id="loginError">用户名或密码错误</p>
</div>
</div>

<div class="container" id="mainContainer">
<div class="header">
<h1>FDD 工作手册</h1>
<button onclick="logout()">退出</button>
</div>
<div class="layout">
<div class="sidebar" id="sidebar"></div>
<div class="content-area" id="contentArea">
<div class="placeholder"><p>请从左侧选择模块</p></div>
</div>
</div>
</div>

<script src="data.js"></script>
<script>
const USERS = { "Effie": "fdd2026!" };
let currentModule = null;

function login() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();
  if (USERS[u] && USERS[u] === p) {
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("mainContainer").style.display = "block";
    loadSidebar();
    makeWatermark();
    sessionStorage.setItem("fdd_auth", "1");
  } else {
    document.getElementById("loginError").style.display = "block";
  }
}
function logout() {
  sessionStorage.removeItem("fdd_auth");
  location.reload();
}
function loadSidebar() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";
  MODULES.forEach((m,i) => {
    const a = document.createElement("a");
    a.className = "sidebar-item";
    a.textContent = m.title;
    a.onclick = () => { loadModule(i); };
    sb.appendChild(a);
  });
  if (sessionStorage.getItem("fdd_last")) {
    loadModule(parseInt(sessionStorage.getItem("fdd_last")));
  }
}
function loadModule(idx) {
  const m = MODULES[idx];
  currentModule = idx;
  sessionStorage.setItem("fdd_last", idx);
  document.getElementById("contentArea").innerHTML = "<h2>" + m.full_title + "</h2>" + m.content;
  document.querySelectorAll(".sidebar-item").forEach((el,i) => {
    el.classList.toggle("active", i === idx);
  });
  document.getElementById("contentArea").scrollTop = 0;
}
function makeWatermark() {
  const w = document.createElement("div");
  w.className = "watermark"; w.id = "watermark";
  const cols = 6, rows = 8;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const s = document.createElement("span");
      s.style.left = (c * 18) + "%";
      s.style.top = (r * 15) + "%";
      if (c % 2 === 0) s.style.top = (r * 15 + 7) + "%";
      s.textContent = "EFFIE FDD MANUAL";
      w.appendChild(s);
    }
  }
  document.body.appendChild(w);
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && document.getElementById("loginOverlay").style.display !== "none") {
    login();
  }
});
if (sessionStorage.getItem("fdd_auth") === "1") {
  document.getElementById("loginOverlay").style.display = "none";
  document.getElementById("mainContainer").style.display = "block";
  loadSidebar();
  makeWatermark();
}
</script>
</body>
</html>
